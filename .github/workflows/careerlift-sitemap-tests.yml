name: CareerLift sitemap tests

on:
  pull_request:
    paths:
      - "careerlift-sitemap/**"
      - ".github/workflows/careerlift-sitemap-tests.yml"
      - ".github/workflows/careerlift-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sitemap regression tests
        run: python -m unittest discover -s careerlift-sitemap/tests -v
      - name: Check Python syntax
        run: python -m py_compile careerlift-sitemap/scripts/generate_sitemap.py
