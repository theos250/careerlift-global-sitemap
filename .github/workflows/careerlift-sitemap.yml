name: CareerLift Global sitemap — build and publish

on:
  push:
    branches: [main]
    paths:
      - "careerlift-sitemap/**"
      - ".github/workflows/careerlift-sitemap.yml"
  pull_request:
    branches: [main]
    paths:
      - "careerlift-sitemap/**"
      - ".github/workflows/careerlift-sitemap.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerlift-sitemap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline regression tests
        run: python -m unittest discover -s careerlift-sitemap/tests -v

      - name: Discover all published posts and generate sitemap
        run: |
          python careerlift-sitemap/scripts/generate_sitemap.py \
            --site "https://www.careerliftglobal.com" \
            --feed "https://www.careerliftglobal.com/feeds/posts/default?alt=atom&max-results=25" \
            --static-urls careerlift-sitemap/static-urls.txt \
            --output public/sitemap.xml \
            --min-posts 800

      - name: Create GitHub Pages project homepage
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <title>CareerLift Global — Sitemap Service</title>
            <style>
              body { margin: 0; padding: 3rem 1.25rem; font: 16px/1.6 system-ui, sans-serif; color: #172033; background: #f5f7fb; }
              main { max-width: 680px; margin: 8vh auto; padding: 2rem; background: #fff; border: 1px solid #e5e9f2; border-radius: 16px; }
              h1 { margin-top: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); }
              a { display: inline-block; margin-top: 1rem; color: #155eef; font-weight: 650; }
              p { color: #475467; }
            </style>
          </head>
          <body>
            <main>
              <h1>CareerLift Global Sitemap Service</h1>
              <p>This service provides an automatically generated sitemap of published CareerLift Global articles to help search engines discover website content.</p>
              <a href="sitemap.xml">View the XML sitemap</a>
            </main>
          </body>
          </html>
          EOF

      - name: Verify deployment payload
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          python -c "from pathlib import Path; p=Path('public/index.html').read_text(); assert 'href=\"sitemap.xml\"' in p; print('Validated project homepage and relative sitemap link')"
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('public/sitemap.xml').getroot(); assert r.tag == '{http://www.sitemaps.org/schemas/sitemap/0.9}urlset'; assert len(r) >= 800; print(f'Validated {len(r)} sitemap URLs')"
          touch public/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
