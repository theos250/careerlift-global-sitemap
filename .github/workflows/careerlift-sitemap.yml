name: CareerLift Global sitemap deployment (approval-gated)

on:
  workflow_dispatch:

# Deployment is intentionally disabled pending explicit approval.
permissions:
  contents: read

jobs:
  approval_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Stop until deployment is explicitly authorized
        run: |
          echo "Deployment is disabled. Use the separate read-only dry-run workflow."
          echo "A production deployment requires a separately approved workflow change."
          exit 0
