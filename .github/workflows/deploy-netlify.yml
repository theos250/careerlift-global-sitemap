name: Deploy CareerLift Global sitemap to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "careerlift-sitemap/scripts/**"
      - "careerlift-sitemap/static-urls.txt"
      - ".github/workflows/deploy-netlify.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: careerlift-sitemap-netlify
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline regression tests
        run: python -m unittest discover -s careerlift-sitemap/tests -v

      - name: Check Blogger latest feed for new posts
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual or code-change run: forcing a complete sitemap rebuild and function deployment."
          else
            python careerlift-sitemap/scripts/check_new_posts.py \\
              --site "https://www.careerliftglobal.com" \\
              --feed "https://www.careerliftglobal.com/feeds/posts/default?alt=atom&max-results=25" \\
              --sitemap "https://effervescent-concha-70a086.netlify.app/sitemap.xml" | tee detection.log
            if grep -q '^changed=true$' detection.log; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Discover published posts and generate sitemap
        if: steps.detect.outputs.changed == 'true'
        run: |
          python careerlift-sitemap/scripts/generate_sitemap.py \\
            --site "https://www.careerliftglobal.com" \\
            --feed "https://www.careerliftglobal.com/feeds/posts/default?alt=atom&max-results=25" \\
            --static-urls careerlift-sitemap/static-urls.txt \\
            --output public/sitemap.xml \\
            --min-posts 800

      - name: Validate sitemap payload
        if: steps.detect.outputs.changed == 'true'
        run: |
          test -s public/sitemap.xml
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('public/sitemap.xml').getroot(); assert r.tag == '{http://www.sitemaps.org/schemas/sitemap/0.9}urlset'; assert len(r) >= 800; print(f'Validated {len(r)} sitemap URLs')"
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow"><title>CareerLift Global Sitemap</title></head>
          <body><main><h1>CareerLift Global Sitemap</h1><p>Automatically generated sitemap of published CareerLift Global blog posts.</p><a href="/sitemap.xml">View XML sitemap</a></main></body>
          </html>
          EOF
          if [ -f careerlift-sitemap/netlify-verification.html ]; then
            cp careerlift-sitemap/netlify-verification.html public/google7d791c87a07882e6.html
          fi
          touch public/.nojekyll

      - name: Deploy sitemap and WebSub callback to Netlify
        if: steps.detect.outputs.changed == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Existing NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets are required."
            exit 1
          fi
          args=(--prod --dir=public --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN")
          if [ -n "$GITHUB_DISPATCH_TOKEN" ]; then args+=(--env "GITHUB_DISPATCH_TOKEN=$GITHUB_DISPATCH_TOKEN"); fi
          if [ -n "$WEBSUB_SECRET" ]; then args+=(--env "WEBSUB_SECRET=$WEBSUB_SECRET"); fi
          npx --yes netlify-cli@23 deploy "${args[@]}"
