name: Subscribe CareerLift Global Blogger feed to WebSub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Subscribe or renew Blogger WebSub subscription
        env:
          WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET }}
        run: python careerlift-sitemap/scripts/subscribe_websub.py
