name: Blogger post feed offset scan (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offset-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan direct feed offsets in 25-entry windows
        run: python diagnostics/complete_feed_offset_scan.py
