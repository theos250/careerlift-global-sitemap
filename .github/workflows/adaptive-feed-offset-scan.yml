name: Read-only adaptive Blogger feed scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-adaptive-blogger-feed-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Blogger feed with overlapping offsets
        run: python diagnostics/adaptive_feed_offset_scan.py
